<VirtualHost *:5000>
    ServerName localhost

    WSGIDaemonProcess keystone-public processes=4 threads=10 user=keystone group=keystone
    WSGIProcessGroup keystone-public
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/lib/openstack/lib/python3.10/site-packages/keystone/server/wsgi.py

    <Directory /var/lib/openstack>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/keystone-public-error.log
    CustomLog /var/log/apache2/keystone-public-access.log combined

    # === OIDC federation with Keycloak ===
    # The mod_auth_openidc directives (OIDCProviderMetadataURL, OIDCClientID,
    # protected <Location> blocks, ...) are generated at container startup by
    # init-keystone.sh into /etc/apache2/conf-available/keystone-oidc.conf and
    # enabled with `a2enconf keystone-oidc` when FEDERATION_ENABLED=true. They
    # are server-scoped (apply to this vhost), so nothing is hardcoded here:
    # change the Keycloak URL / client in conf.env and restart Keystone.
</VirtualHost>

<VirtualHost *:35357>
    ServerName localhost

    WSGIDaemonProcess keystone-admin processes=4 threads=10 user=keystone group=keystone
    WSGIProcessGroup keystone-admin
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/lib/openstack/bin/keystone-wsgi-admin

    <Directory /var/lib/openstack/bin>
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/keystone-admin-error.log
    CustomLog /var/log/apache2/keystone-admin-access.log combined
</VirtualHost>