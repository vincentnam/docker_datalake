<VirtualHost *:5000>
    ServerName localhost

    WSGIDaemonProcess keystone-public processes=4 threads=10 user=keystone group=keystone
    WSGIProcessGroup keystone-public
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/lib/openstack/lib/python3.10/site-packages/keystone/server/wsgi.py

    <Directory /var/lib/openstack>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/keystone-public-error.log
    CustomLog /var/log/apache2/keystone-public-access.log combined


;
;     # === OIDC Config (pour fédération avec Keycloak externe) ===
;     OIDCClaimPrefix "HTTP_OIDC_"
;     OIDCScope "openid email profile groups"
;     OIDCResponseType "code"
;     OIDCProviderMetadataURL https://keycloak.example.com/auth/realms/mon-realm/.well-known/openid-configuration
;     OIDCClientID keystone-client
;     OIDCClientSecret VOTRE_CLIENT_SECRET_DE_KEYCLOAK
;     OIDCRedirectURI https://VOTRE_IP:7000/v3/OS-FEDERATION/identity_providers/keycloak/protocols/openid/auth/redirect
;     OIDCCryptoPassphrase une_phrase_super_longue_et_aleatoire_pour_encryption_2026!
;
;     # Protection des endpoints fédérés
;     <Location ~ "^/v3/OS-FEDERATION/identity_providers/keycloak/protocols/openid/auth">
;         AuthType openid-connect
;         Require valid-user
;     </Location>
;
;     <Location ~ "^/v3/auth/OS-FEDERATION/websso/openid">
;         AuthType openid-connect
;         Require valid-user
;     </Location>
</VirtualHost>

<VirtualHost *:35357>
    ServerName localhost

    WSGIDaemonProcess keystone-admin processes=4 threads=10 user=keystone group=keystone
    WSGIProcessGroup keystone-admin
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/lib/openstack/bin/keystone-wsgi-admin

    <Directory /var/lib/openstack/bin>
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/keystone-admin-error.log
    CustomLog /var/log/apache2/keystone-admin-access.log combined
</VirtualHost>