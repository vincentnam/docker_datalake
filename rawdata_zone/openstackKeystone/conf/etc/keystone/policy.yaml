# ==============================================================================
# POLICY.YAML
# ==============================================================================

# === REGLES DE BASE & ALIAS ===
"global_admin_required": "role:admin or is_admin:1"
"owner": "user_id:%(user_id)s"

"same_target_project": "token.project.id:%(target.project.id)s"

"bucket_owner_on_target_project": "role:bucket_owner and rule:same_target_project"
"bucket_admin_on_target_project": "role:bucket_admin and rule:same_target_project"

"project_role_manager": "rule:bucket_owner_on_target_project or rule:bucket_admin_on_target_project"

"target_role_is_admin": "target.role.name:admin"
"target_role_is_bucket_owner": "target.role.name:bucket_owner"

# === PROJECTS ===
"identity:create_project": "rule:global_admin_required"
"identity:list_projects": "rule:global_admin_required or role:bucket_owner or role:bucket_admin"
"identity:list_user_projects": "rule:global_admin_required or role:bucket_owner or role:bucket_admin or rule:owner"
"identity:list_projects_for_user": "rule:global_admin_required or role:bucket_owner or role:bucket_admin or rule:owner"
"identity:get_project": "rule:global_admin_required or rule:project_role_manager"
"identity:update_project": "rule:global_admin_required or rule:project_role_manager"
"identity:delete_project": "rule:global_admin_required"

# === USERS ===
"identity:list_users": "rule:global_admin_required or role:bucket_owner or role:bucket_admin"
"identity:get_user": "rule:global_admin_required or rule:owner or role:bucket_owner or role:bucket_admin"
"identity:update_user": "rule:global_admin_required or rule:owner"
"identity:delete_user": "rule:global_admin_required"

# === ROLE ASSIGNMENTS  ===
"identity:list_role_assignments": "rule:global_admin_required or rule:project_role_manager or role:bucket_owner or role:bucket_admin"
"identity:create_grant": "rule:global_admin_required or (rule:project_role_manager and not rule:target_role_is_admin and not rule:target_role_is_bucket_owner)"
"identity:delete_grant": "rule:global_admin_required or (rule:project_role_manager and not rule:target_role_is_admin and not rule:target_role_is_bucket_owner)"
"identity:list_grants": "rule:global_admin_required or rule:project_role_manager"
"identity:check_grant": "rule:global_admin_required or rule:project_role_manager"

# === ROLES ===
"identity:list_roles": "rule:global_admin_required or role:bucket_owner or role:bucket_admin"
"identity:get_role": "rule:global_admin_required or role:bucket_owner or role:bucket_admin"

# === AUTRES (services Keystone) ===
"identity:list_endpoints": "rule:global_admin_required"
"identity:list_services": "rule:global_admin_required"

# === SECURITE TOKENS ===
"identity:create_token": ""
"identity:validate_token": ""
"identity:check_token": ""
"identity:revoke_token": ""

# === FALLBACK ===
"default": "rule:global_admin_required"



