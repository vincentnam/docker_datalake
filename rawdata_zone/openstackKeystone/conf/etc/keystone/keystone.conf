[database]
connection = mysql+pymysql://keystone:keystone_db_pass@mariadb/keystone

[token]
provider = fernet

[cache]
enabled = true
backend = oslo_cache.memcache_pool
memcache_servers = memcached:11211

[policy]
policy_file = policy.yaml
policy_default_rule = default

# === OIDC federation with Keycloak ===
# The OS-FEDERATION protocol id is "mapped" (KEYCLOAK_PROTOCOL_ID), which maps to
# the built-in "mapped" auth method already enabled below. Keystone 2026.1 loads
# auth methods strictly by registered name, so the protocol must be "mapped".
# mod_auth_openidc (keystone-oidc.conf rendered by init-keystone.sh) injects the
# claims; remote_id_attribute is the env var carrying the Keycloak issuer used to
# match the identity provider.
[auth]
methods = external,password,token,oauth1,mapped,application_credential

[federation]
# mod_auth_openidc (OIDCClaimPrefix "HTTP_OIDC_") exposes claims keeping the
# original (lowercase) Keycloak claim names, so the issuer env var is
# HTTP_OIDC_iss (lowercase), NOT HTTP_OIDC_ISS.
remote_id_attribute = HTTP_OIDC_iss
# WebSSO (browser login through Horizon) - uncomment and point to your dashboard:
#trusted_dashboard = http://localhost:8080/auth/websso/
#sso_callback_template = /etc/keystone/sso_callback_template.html

[EXTRA]
servername = keystone