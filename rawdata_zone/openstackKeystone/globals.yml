---
# You can use this file to override _any_ variable throughout Kolla.
# Additional options can be found in the
# 'kolla-ansible/ansible/group_vars/all' directory. Default value of all the
# commented parameters are shown here, To override the default value uncomment
# the parameter and change its value.

# Dummy variable to allow Ansible to accept this file.
workaround_ansible_issue_8743: yes

###################
# Ansible options
###################

###############################
# Options générales
###############################
kolla_base_distro: "ubuntu"
kolla_install_type: "binary"
# Kolla 2025.1 is the last version to support Rocky Linux 9
openstack_release: "2025.1"
# eth0 IP adresse of interface is 172.31.204.48 - need to set up a non used IP for vip adress
kolla_internal_vip_address: "172.31.204.148"
kolla_external_vip_adresse: "{{ kolla_internal_vip_address }}"
network_interface: "eth0"

enable_keepalived: "yes"

###############################
# Services OpenStack
###############################

# Activer uniquement Keystone + Horizon
enable_keystone: "yes"
enable_horizon: "yes"

###############################
# Désactivation explicite des autres services OpenStack
###############################
enable_glance: "no"
enable_nova: "no"
enable_neutron: "no"
enable_cinder: "no"
enable_swift: "no"
enable_heat: "no"
enable_magnum: "no"
enable_mistral: "no"
enable_barbican: "no"
enable_octavia: "no"
enable_designate: "no"
enable_trove: "no"
enable_ironic: "no"
enable_sahara: "no"
enable_manila: "no"
enable_ceilometer: "no"
enable_gnocchi: "no"
enable_panko: "no"
enable_aodh: "no"
enable_zun: "no"
enable_kuryr: "no"
enable_senlin: "no"
enable_blazar: "no"

###############################
# Dépendances nécessaires
###############################

# Base de données
enable_mariadb: "yes"

# Message queue
enable_rabbitmq: "yes"

# Cache
enable_memcached: "yes"

# Web / proxy
enable_haproxy: "yes"

# Chrony
enable_chrony: "no"

###############################
# Services optionnels mais utiles
###############################
enable_etcd: "no"
enable_prometheus: "no"
enable_grafana: "no"
enable_kibana: "no"
enable_elasticsearch: "no"
enable_fluentd: "no"