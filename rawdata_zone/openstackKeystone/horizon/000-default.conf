<VirtualHost *:80>
    ServerName horizon.local

    WSGIDaemonProcess horizon processes=4 threads=10 user=horizon group=horizon python-home=/var/lib/openstack
    WSGIProcessGroup horizon
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /usr/local/share/openstack_dashboard/wsgi.py

    <Directory /usr/local/share/openstack_dashboard>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/html/horizon/
    <Directory  /var/www/html/horizon/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/horizon-error.log
    CustomLog /var/log/apache2/horizon-access.log combined
</VirtualHost>