services:
  initswift:
    profiles:
      - backend
      - storage
      - datalake
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    volumes:
      - ./rawdata_zone/openstackSwift/conf/:/etc/swift
      - ./rawdata_zone/openstackSwift/data/:/srv/
      - ./rawdata_zone/openstackSwift/scripts:/scripts/
    command: sh /scripts/init.sh
    #user: "${UID:-1000}:${GID:-1000}"
    privileged: true
    depends_on:
      keystone:
        condition: service_healthy
    networks:
      - swift-cluster

  management-1:
    profiles:
      - backend
      - storage
      - datalake
    hostname: management-1
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    entrypoint: ["sh","/scripts/management/management-1.sh"]
    volumes:
        - ./rawdata_zone/openstackSwift/conf/:/etc/swift
        - ./rawdata_zone/openstackSwift/scripts:/scripts/
    privileged: true
    #user: "${UID:-1000}:${GID:-1000}"
#    ports:
#      - "8080:8080"
    restart: always
    networks:
      swift-cluster:
        ipv4_address: 10.5.10.1
    depends_on:
      initswift:
        condition: service_completed_successfully
  storage-1:
    profiles:
      - backend
      - storage
      - datalake
    hostname: storage-1
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    entrypoint: ["sh","/scripts/storage/storage-1.sh"]
    #user: "${UID:-1000}:${GID:-1000}"
    volumes:
        - ./rawdata_zone/openstackSwift/conf/:/etc/swift
        - ./rawdata_zone/openstackSwift/data/:/internal_dev/
        - ./rawdata_zone/openstackSwift/scripts:/scripts/
        - ./rawdata_zone/openstackSwift/rsyncd/rsyncd-1.conf:/etc/rsyncd.conf
    privileged: true
    restart: always
    networks:
      swift-cluster:
        ipv4_address: 10.5.1.1
    depends_on:
      initswift:
        condition: service_completed_successfully

  mariadb:
    image: mariadb:10.9
    container_name: mariadb
    hostname: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=keystone
      - MYSQL_USER=keystone
      - MYSQL_PASSWORD=keystone_db_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.3
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  memcached:
    image: memcached:alpine
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.4

  keystone:
    image: keystone:2026.1-ubuntu_noble
    container_name: keystone
    restart: always
    profiles:
      - datalake
      - authentication
#    ports:
#      - "5000:5000"
#      - "35357:35357"   # Admin endpoint
    volumes:
      - ./rawdata_zone/openstackKeystone/conf/etc/keystone:/etc/keystone:rw
      - ./rawdata_zone/openstackKeystone/conf/apache2/keystone/ports.conf:/etc/apache2/ports.conf:ro
      - ./rawdata_zone/openstackKeystone/conf/apache2/keystone/sites-available/keystone.conf:/etc/apache2/sites-available/keystone.conf:ro
      - ./rawdata_zone/openstackKeystone/conf/python/keystone/wsgi/wsgi.py:/var/lib/openstack/lib/python3.10/site-packages/keystone/server/wsgi.py
      - ./rawdata_zone/openstackKeystone/scripts/init-keystone.sh:/entrypoint.sh:ro
      - keystone_data:/var/lib/keystone
    command: /entrypoint.sh
    environment:
      - OS_PASSWORD=pipi
      # --- OIDC federation (consumed by init-keystone.sh / mod_auth_openidc) ---
      - FEDERATION_ENABLED=true
      - KEYCLOAK_ISSUER=http://localhost:8088/realms/MIDOC
      # JWKS endpoint reached internally by Keystone to validate bearer access
      # tokens (oauth20). Internal URL : works even though the issuer is public.
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/MIDOC/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_ID=keystone
      - KEYCLOAK_CLIENT_SECRET=EdMYtZ8ra9rTlloVQTPGJdc0qtMuEKiU
      - OIDC_CRYPTO_PASSPHRASE=ChangeMe_long_random_oidc_passphrase_2026
      - KEYCLOAK_IDP_ID=keycloak
      - KEYCLOAK_PROTOCOL_ID=mapped
      - KEYSTONE_PUBLIC_URL=http://localhost:5000
    depends_on:
        mariadb:
          condition: service_healthy
        memcached:
          condition: service_started   # memcached est prêt quasi immédiatement
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
      start_interval: 2s

  keystone_bootstrap:
    build:
      context: ./rawdata_zone/openstackKeystone
      dockerfile: Dockerfile.openstackClientBootstrap
    environment:
      - OS_AUTH_URL=http://keystone:5000/v3
      - OS_USERNAME=admin
      - OS_PASSWORD=pipi
      - OS_PROJECT_NAME=admin
      - OS_USER_DOMAIN_NAME=Default
      - OS_PROJECT_DOMAIN_NAME=Default
      - SWIFT_PASSWORD=pipi           # change si besoin
      # --- OIDC federation registration (identity provider / mapping / protocol) ---
      - FEDERATION_ENABLED=true
      - KEYCLOAK_ISSUER=http://localhost:8088/realms/MIDOC
      - KEYCLOAK_IDP_ID=keycloak
      - KEYCLOAK_PROTOCOL_ID=mapped
      - FEDERATED_DOMAIN=keycloak
      - FEDERATED_GROUP=datalake_users
      - FEDERATED_PROJECT=federated
      - FEDERATED_ROLE=bucket_owner
      - IDP_READER_USER=idp-reader
      - IDP_READER_PASSWORD=ChangeMe_idp_reader
    profiles:
      - datalake
      - frontend
      - process
      - authentication
    container_name: keystone_bootstrap
    networks:
      swift-cluster:
          ipv4_address: 10.5.3.30
    command: sh /bootstrap_keystone.sh
    depends_on:
      keystone:
        condition: service_healthy


  horizon:
    image: horizon:2026.1-ubuntu_noble
    container_name: horizon
    restart: always
    profiles:
      - authentication
      - datalake
    ports:
      - "8080:80"
    volumes:
      - ./rawdata_zone/openstackKeystone/conf/etc/horizon/local_settings.py:/local_settings.py:ro
      - ./rawdata_zone/openstackKeystone/conf/apache2/horizon/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./rawdata_zone/openstackKeystone/scripts/init-horizon.sh:/entrypoint.sh:ro
    command: /entrypoint.sh
    depends_on:
      - keystone
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.2

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: always
    profiles:
      - datalake
      - authentication
      - keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=ChangeMe_keycloak_admin
      - KC_HTTP_ENABLED=true
      # Pin the public hostname so the token issuer is stable and matches what
      # the browser logs in through (KEYCLOAK_PUBLIC_URL / the Keystone IdP).
      - KC_HOSTNAME=http://localhost:8088
      - KC_HOSTNAME_STRICT=false
      # Let in-cluster services (Keystone/Flask) resolve token/userinfo endpoints
      # through the docker hostname while the browser uses KC_HOSTNAME.
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "8088:8080"
    volumes:
      - ./rawdata_zone/openstackKeycloak/realm/:/opt/keycloak/data/import/:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.5

  hub:
    build:
      context: ./process_zone/jupyter
      dockerfile: Dockerfile.jupyterhub
      args:
        JUPYTERHUB_VERSION: 5.3.0
    profiles:
      - datalake
      - frontend
      - process
    #user: "${UID:-1000}:${GID:-1000}"
    restart: always
    image: jupyterhub
    container_name: jupyterhub
    networks:
      swift-cluster:
          ipv4_address: 10.5.100.1

    volumes:
      # The JupyterHub configuration file
      - ./process_zone/jupyter/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - ./process_zone/jupyter/jupyterhub-data:/data
#    ports:
#      - 8000:8000
    environment:
      # This username will be a JupyterHub admin
      JUPYTERHUB_ADMIN: admin
      # All containers will join this network
      DOCKER_NETWORK_NAME: swift-cluster
      # JupyterHub will spawn this Notebook image for users
      DOCKER_NOTEBOOK_IMAGE: cors_base-notebook:latest
      #DOCKER_NOTEBOOK_IMAGE: quay.io/jupyter/base-notebook:latest
      # Notebook directory inside user image
      DOCKER_NOTEBOOK_DIR: /home/jovyan/work
  web_gui:
    profiles:
      - frontend
      - webgui
      - datalake
      - authentication
    build:
      context: ./access_zone/web_gui
      dockerfile: Dockerfile.web_gui
    image: web_gui
    container_name: web_gui
    volumes:
      - ./access_zone/web_gui:/opt/app/web_gui/
    networks:
        swift-cluster:
          ipv4_address: 10.5.255.1
  nginx-proxy:
    build:
      context: ./access_zone/nginx
      dockerfile: Dockerfile.nginx
    container_name: nginx_proxy
    restart: unless-stopped
    profiles:
      - frontend
      - datalake
      - authentication
    ports:
      - "7000:80"
    depends_on:
      - web_gui
      - flask-app
    networks:
      swift-cluster:
        ipv4_address: 10.5.255.254


  flask-app:
    build:
      context: ./access_zone/flask
      dockerfile: Dockerfile.flask
    restart: always
    #user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - frontend
      - RESTApi
      - datalake
      - authentication
    volumes:
      - "./access_zone/flask/app.py:/home/app/app.py"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:5000/flask-health-check || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      #for tests
#    command: gunicorn -w 3 -t 60 -b 0.0.0.0:5000 app:app
    command: python /home/app/app.py
    networks:
      swift-cluster:
        ipv4_address: 10.5.255.2


#END SERVICE SECTION
######################

volumes:
  OpenstackSwiftData:
    name: OpenstackSwiftData
  mariadb_data:
  keystone_data:
  keycloak_data:




networks:
#  jupyterhub-network:
#    name: jupyterhub-network
  swift-cluster:
    name: swift-cluster
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1
