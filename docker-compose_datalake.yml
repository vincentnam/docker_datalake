services:
  initswift:
    profiles:
      - backend
      - storage
      - datalake
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    volumes:
      - ./rawdata_zone/openstackSwift/conf/:/etc/swift
      - ./rawdata_zone/openstackSwift/data/:/srv/
      - ./rawdata_zone/openstackSwift/scripts:/scripts/
    command: sh /scripts/init.sh
    #user: "${UID:-1000}:${GID:-1000}"
    privileged: true
    depends_on:
      keystone:
        condition: service_healthy
    networks:
      - swift-cluster

  management-1:
    profiles:
      - backend
      - storage
      - datalake
    hostname: management-1
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    entrypoint: ["sh","/scripts/management/management-1.sh"]
    volumes:
        - ./rawdata_zone/openstackSwift/conf/:/etc/swift
        - ./rawdata_zone/openstackSwift/scripts:/scripts/
    privileged: true
    #user: "${UID:-1000}:${GID:-1000}"
#    ports:
#      - "8080:8080"
    restart: always
    networks:
      swift-cluster:
        ipv4_address: 10.5.10.1
    depends_on:
      initswift:
        condition: service_completed_successfully
  storage-1:
    profiles:
      - backend
      - storage
      - datalake
    hostname: storage-1
    build:
      context: ./rawdata_zone/openstackSwift
      dockerfile: Dockerfile.base
    entrypoint: ["sh","/scripts/storage/storage-1.sh"]
    #user: "${UID:-1000}:${GID:-1000}"
    volumes:
        - ./rawdata_zone/openstackSwift/conf/:/etc/swift
        - ./rawdata_zone/openstackSwift/data/:/internal_dev/
        - ./rawdata_zone/openstackSwift/scripts:/scripts/
        - ./rawdata_zone/openstackSwift/rsyncd/rsyncd-1.conf:/etc/rsyncd.conf
    privileged: true
    restart: always
    networks:
      swift-cluster:
        ipv4_address: 10.5.1.1
    depends_on:
      initswift:
        condition: service_completed_successfully

  mariadb:
    image: mariadb:10.9
    container_name: mariadb
    hostname: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=keystone
      - MYSQL_USER=keystone
      - MYSQL_PASSWORD=keystone_db_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.3
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  memcached:
    image: memcached:alpine
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.4

  keystone:
    image: keystone:master-ubuntu_jammy
    container_name: keystone
    restart: always
#    ports:
#      - "5000:5000"
#      - "35357:35357"   # Admin endpoint
    volumes:
      - ./rawdata_zone/openstackKeystone/conf/etc/keystone:/etc/keystone:rw
      - ./rawdata_zone/openstackKeystone/conf/apache2/keystone/ports.conf:/etc/apache2/ports.conf:ro
      - ./rawdata_zone/openstackKeystone/conf/apache2/keystone/sites-available/keystone.conf:/etc/apache2/sites-available/keystone.conf:ro
      - ./rawdata_zone/openstackKeystone/conf/python/keystone/wsgi/wsgi.py:/var/lib/openstack/lib/python3.10/site-packages/keystone/server/wsgi.py
      - ./rawdata_zone/openstackKeystone/scripts/init-keystone.sh:/entrypoint.sh:ro
      - keystone_data:/var/lib/keystone
    command: /entrypoint.sh
    depends_on:
        mariadb:
          condition: service_healthy
        memcached:
          condition: service_started   # memcached est prêt quasi immédiatement
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
  keystone_bootstrap:
    build:
      context: ./rawdata_zone/openstackKeystone
      dockerfile: Dockerfile.openstackClientBootstrap
    environment:
      - OS_AUTH_URL=http://keystone:5000/v3
      - OS_USERNAME=admin
      - OS_PASSWORD=admin
      - OS_PROJECT_NAME=admin
      - OS_USER_DOMAIN_NAME=Default
      - OS_PROJECT_DOMAIN_NAME=Default
      - SWIFT_PASSWORD=testing           # change si besoin
    profiles:
      - datalake
      - frontend
      - process
    container_name: keystone_bootstrap
    networks:
      swift-cluster:
          ipv4_address: 10.5.3.30
    command: sh /bootstrap_keystone.sh
    depends_on:
      keystone:
        condition: service_healthy


  horizon:
    image: horizon:master-ubuntu_jammy
    container_name: horizon
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./rawdata_zone/openstackKeystone/conf/etc/horizon/local_settings.py:/local_settings.py:ro
      - ./rawdata_zone/openstackKeystone/conf/apache2/horizon/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./rawdata_zone/openstackKeystone/scripts/init-horizon.sh:/entrypoint.sh:ro
    command: /entrypoint.sh
    depends_on:
      - keystone
    networks:
      swift-cluster:
        ipv4_address: 10.5.3.2

  hub:
    build:
      context: ./process_zone/jupyter
      dockerfile: Dockerfile.jupyterhub
      args:
        JUPYTERHUB_VERSION: 5.3.0
    profiles:
      - datalake
      - frontend
      - process
    #user: "${UID:-1000}:${GID:-1000}"
    restart: always
    image: jupyterhub
    container_name: jupyterhub
    networks:
      swift-cluster:
          ipv4_address: 10.5.100.1

    volumes:
      # The JupyterHub configuration file
      - ./process_zone/jupyter/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - ./process_zone/jupyter/jupyterhub-data:/data
#    ports:
#      - 8000:8000
    environment:
      # This username will be a JupyterHub admin
      JUPYTERHUB_ADMIN: admin
      # All containers will join this network
      DOCKER_NETWORK_NAME: swift-cluster
      # JupyterHub will spawn this Notebook image for users
      DOCKER_NOTEBOOK_IMAGE: cors_base-notebook:latest
      #DOCKER_NOTEBOOK_IMAGE: quay.io/jupyter/base-notebook:latest
      # Notebook directory inside user image
      DOCKER_NOTEBOOK_DIR: /home/jovyan/work
  web_gui:
    profiles:
      - frontend
      - webgui
      - datalake
    build:
      context: ./access_zone/web_gui
      dockerfile: Dockerfile.web_gui
    image: web_gui
    container_name: web_gui
    volumes:
      - ./access_zone/web_gui/web_gui:/opt/app/web_gui/
    networks:
        swift-cluster:
          ipv4_address: 10.5.255.1
  nginx-proxy:
    build:
      context: ./access_zone/nginx
      dockerfile: Dockerfile.nginx
    container_name: nginx_proxy
    restart: unless-stopped
    profiles:
      - frontend
      - datalake
    ports:
      - "7000:80"
    depends_on:
      - web_gui
      - flask-app
    networks:
      swift-cluster:
        ipv4_address: 10.5.255.254


  flask-app:
    build:
      context: ./access_zone/flask
      dockerfile: Dockerfile.flask
    restart: always
    #user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - frontend
      - RESTApi
      - datalake
    volumes:
      - "./access_zone/flask/app.py:/home/app/app.py"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:5000/flask-health-check || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      #for tests
#    command: gunicorn -w 3 -t 60 -b 0.0.0.0:5000 app:app
    command: python /home/app/app.py
    networks:
      swift-cluster:
        ipv4_address: 10.5.255.2



  caddy:
    image: caddy:2-alpine
    container_name: caddy_temp_proxy
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "2015:80"    # Web GUI
      - "5000:5000"  # Keystone
      - "5001:5001"  # flask
      - "8081:8080"  # Swift - Horizon
    volumes:
      - ./debug/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - swift-cluster
#END SERVICE SECTION
######################

volumes:
  OpenstackSwiftData:
    name: OpenstackSwiftData
  mariadb_data:
  keystone_data:




networks:
#  jupyterhub-network:
#    name: jupyterhub-network
  swift-cluster:
    name: swift-cluster
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1
