server {
    listen 80;
    server_name _;  # accepte tout

    # Taille max pour les uploads (utile JupyterHub)
    client_max_body_size 500M;

    # 1. Application web principale (défaut sur /)
    location / {
        proxy_pass         http://10.5.255.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # 2. API Flask → /api/
    location /api/ {
        proxy_pass         http://10.5.255.2:5000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Réécrit les URLs renvoyées par Flask si besoin
        sub_filter_once off;
        sub_filter 'href="/' 'href="/api/';
        sub_filter 'src="/'  'src="/api/';
    }
location /hub/ {
    # NOTE: Pas de slash à la fin de l'IP, on laisse base_url gérer le chemin
    proxy_pass http://10.5.100.1:8000;

    # Headers Websocket (Indispensables)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Headers Proxy Standards
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gestion du Scheme pour que Jupyter sache s'il est en https ou http
    proxy_set_header X-Scheme $scheme;

    proxy_buffering off;
}
}