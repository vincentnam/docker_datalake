server {
    listen 80;
    server_name _;  # accepte tout

    # Taille max pour les uploads (utile JupyterHub)
    client_max_body_size 500M;

    # 1. Application web principale (défaut sur /)
    location / {
        proxy_pass         http://10.5.255.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # 2. API Flask → /api/
    location /api/ {
        proxy_pass         http://10.5.255.2:5000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Réécrit les URLs renvoyées par Flask si besoin
        sub_filter_once off;
        sub_filter 'href="/' 'href="/api/';
        sub_filter 'src="/'  'src="/api/';
    }

    # 3. JupyterHub → /hub/
    location /hub/ {
        proxy_pass         http://10.5.100.1:8000/hub/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (obligatoire pour Jupyter)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Les single-user notebooks (très important !)
    location ~ ^/user/[^/]+(/.*)?$ {
        proxy_pass         http://10.5.100.1:8000$1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}