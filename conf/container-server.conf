[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6001
devices = /srv/node/sdb0
workers = auto
client_timeout = 60
node_timeout = 10
conn_timeout = 0.5
log_level = INFO
log_address = /dev/log
mount_check = true
fallocate_reserve = 1%
db_preallocation = off
allowed_sync_hosts = 127.0.0.1

[pipeline:main]
pipeline = healthcheck recon container-server

[app:container-server]
use = egg:swift#container
allow_versions = false
replication_server = true

[filter:healthcheck]
use = egg:swift#healthcheck

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift

[container-replicator]
interval = 30
concurrency = 8
per_diff = 1000
max_diffs = 100
databases_per_second = 50
rsync_module = {replication_ip}::container
reclaim_age = 604800
handoffs_only = false
handoff_delete = auto

[container-updater]
interval = 300
concurrency = 4
containers_per_second = 50
account_suppression_time = 60

[container-auditor]
interval = 1800
containers_per_second = 200

[container-sync]
interval = 300
container_time = 60
conn_timeout = 5
request_tries = 3

[container-sharder]
auto_shard = false
shard_container_threshold = 1000000
rows_per_shard = 500000
minimum_shard_size = 100000
shrink_threshold = 100000
expansion_limit = 750000
shard_scanner_batch_size = 10
cleave_batch_size = 2
cleave_row_batch_size = 10000
max_expanding = -1
max_shrinking = 1
shard_replication_quorum = auto
existing_shard_replication_quorum = auto
internal_client_conf_path = /etc/swift/internal-client.conf
request_tries = 3
recon_candidates_limit = 5
recon_sharded_timeout = 43200
container_sharding_timeout = 172800
periodic_warnings_interval = 86400
broker_timeout = 60
stats_interval = 3600
interval = 30
databases_per_second = 50