apiVersion: v1
kind: Service
metadata:
  name: mariadb                             # = serviceName du StatefulSet ; mariadb:3306 dans keystone.conf
  namespace: datalake
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: security-zone
spec:
  clusterIP: None                           # headless : « mariadb » pointe directement sur le pod, seulement quand il est prêt
  selector:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
