apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: horizon
  name: horizon
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: horizon
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: horizon
    spec:
      containers:
        - args:
            - /entrypoint.sh
          image: horizon:2026.1-ubuntu_noble
          name: horizon
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /local_settings.py
              name: horizon-claim0
              readOnly: true
            - mountPath: /etc/apache2/sites-available/000-default.conf
              name: horizon-claim1
              readOnly: true
            - mountPath: /entrypoint.sh
              name: horizon-claim2
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: horizon-claim0
          persistentVolumeClaim:
            claimName: horizon-claim0
            readOnly: true
        - name: horizon-claim1
          persistentVolumeClaim:
            claimName: horizon-claim1
            readOnly: true
        - name: horizon-claim2
          persistentVolumeClaim:
            claimName: horizon-claim2
            readOnly: true
