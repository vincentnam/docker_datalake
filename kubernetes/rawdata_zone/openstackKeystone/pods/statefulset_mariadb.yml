# Template rendu par le -r de start.sh : ${MARIADB_VERSION} et ${MARIADB_STORAGE_REQUEST} viennent de conf.env
# Base de Keystone UNIQUEMENT : une base critique n'est jamais partagée, un autre service aura sa propre instance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: datalake
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: security-zone
    app.kubernetes.io/version: "${MARIADB_VERSION}"
spec:
  serviceName: mariadb                      # headless Service : identité réseau du pod (mariadb-0.mariadb)
  replicas: 1                               # une seule instance : pas de réplication MariaDB
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:     # supprimer le StatefulSet ne supprime jamais le disque
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/component: database
  template:
    metadata:
      annotations:
        checksum/config: "${MARIADB_CONF_HASH}"   # empreinte de la conf générée (-r de start.sh) : conf changée = pods remplacés
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: security-zone
        app.kubernetes.io/version: "${MARIADB_VERSION}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                      # utilisateur « mysql » de l'image officielle
        runAsGroup: 999
        fsGroup: 999                        # le disque devient accessible en écriture au groupe 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:${MARIADB_VERSION}
          imagePullPolicy: IfNotPresent
          args: ["--innodb-buffer-pool-size=256M"]   # cache InnoDB, à garder bien sous la limite mémoire
          envFrom:
            - secretRef:
                name: mariadb-env           # root, base et utilisateur keystone (création au premier démarrage)
          env:
            - name: MARIADB_AUTO_UPGRADE    # nouvelle version majeure : mariadb-upgrade lancé au démarrage
              value: "1"
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          # healthcheck.sh est fourni par l'image ; son utilisateur est créé à l'initialisation de la base.
          startupProbe:                     # premier démarrage = initialisation de la base : jusqu'à 5 min
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data                    # le disque (PVC créée par volumeClaimTemplates)
              mountPath: /var/lib/mysql
            - name: run                     # socket et pid du serveur
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # data : ajouté automatiquement par le StatefulSet à partir de volumeClaimTemplates
      restartPolicy: Always
      terminationGracePeriodSeconds: 60     # SIGTERM = arrêt propre : MariaDB vide ses tampons avant de s'arrêter
  volumeClaimTemplates:
    - metadata:
        name: data                          # PVC data-mariadb-0, liée à un PV de la classe mariadb-disks
        labels:
          app.kubernetes.io/name: mariadb
          app.kubernetes.io/component: database
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mariadb-disks
        resources:
          requests:
            storage: ${MARIADB_STORAGE_REQUEST}   # 90 % de MARIADB_STORAGE_SIZE (taille minimale du disque accepté)
