apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: keystone-bootstrap
  name: keystone-bootstrap
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: keystone-bootstrap
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: keystone-bootstrap
    spec:
      containers:
        - args:
            - sh
            - /bootstrap_keystone.sh
          env:
            - name: FEDERATED_DOMAIN
              value: keycloak
            - name: FEDERATED_GROUP
              value: datalake_users
            - name: FEDERATED_PROJECT
              value: federated
            - name: FEDERATED_ROLE
              value: bucket_owner
            - name: FEDERATION_ENABLED
              value: "true"
            - name: IDP_READER_PASSWORD
              value: ChangeMe_idp_reader
            - name: IDP_READER_USER
              value: idp-reader
            - name: KEYCLOAK_IDP_ID
              value: keycloak
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8088/realms/MIDOC
            - name: KEYCLOAK_PROTOCOL_ID
              value: mapped
            - name: OS_AUTH_URL
              value: http://keystone:5000/v3
            - name: OS_PASSWORD
              value: pipi
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_USERNAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: SWIFT_PASSWORD
              value: pipi
          image: keystone-bootstrap
          name: keystone-bootstrap
      restartPolicy: Always
