apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: management-1
  name: management-1
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: management-1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: management-1
    spec:
      containers:
        - command:
            - sh
            - /scripts/management/management-1.sh
          image: management-1
          name: management-1
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /etc/swift
              name: management-1-claim0
            - mountPath: /scripts
              name: management-1-claim1
      hostname: management-1
      restartPolicy: Always
      volumes:
        - name: management-1-claim0
          persistentVolumeClaim:
            claimName: management-1-claim0
        - name: management-1-claim1
          persistentVolumeClaim:
            claimName: management-1-claim1
