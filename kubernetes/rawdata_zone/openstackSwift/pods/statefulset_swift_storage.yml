# Template rendu par kubernetes/start.sh : ${SWIFT_STORAGE_REPLICAS} et ${SWIFT_STORAGE_REQUEST} viennent de conf.env
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swift-storage
  namespace: datalake
  labels:
    app.kubernetes.io/name: swift
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: raw-data-zone
    app.kubernetes.io/version: "2.30.0"
spec:
  serviceName: swift-storage                # headless Service : un nom DNS stable par pod, utilisé dans les rings
  replicas: ${SWIFT_STORAGE_REPLICAS}       # = NB_STORAGE_NODE : un disque (PV) par storage pod
  podManagementPolicy: OrderedReady         # 0, puis 1, puis 2… chacun attend que le précédent soit prêt
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:     # supprimer le StatefulSet ou réduire replicas ne supprime jamais les disques
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: swift
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swift
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: raw-data-zone
        app.kubernetes.io/version: "2.30.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 55555
        runAsGroup: 55555
        fsGroup: 55555
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ==================== serveurs : écoutent sur un port, ont des probes ====================
        - name: account-server
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-account-server", "/etc/swift/account-server.conf", "verbose"]
          ports:
            - name: account
              containerPort: 6200
          volumeMounts: &swift-mounts
            - name: swift-etc                   # confs + rings + swift.conf
              mountPath: /etc/swift
              readOnly: true
            - name: d1                          # le disque (PVC créée par volumeClaimTemplates) = device « d1 » du ring
              mountPath: /srv/node/d1
            - name: swift-cache                 # cache « recon » : écrit par les démons, lu par les serveurs
              mountPath: /var/cache/swift
            - name: tmp
              mountPath: /tmp
          resources: &server-resources
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthcheck, port: account}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthcheck, port: account}
            periodSeconds: 20
            failureThreshold: 3
          lifecycle: &graceful-stop
            preStop:
              exec:
                # SIGHUP = arrêt gracieux de Swift (les requêtes en cours se terminent) ; SIGTERM couperait net.
                # Le hook attend la fin du processus, dans la limite de terminationGracePeriodSeconds.
                command: ["/bin/sh", "-c", "kill -HUP 1; while kill -0 1 2>/dev/null; do sleep 1; done"]
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        - name: container-server
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-container-server", "/etc/swift/container-server.conf", "verbose"]
          ports:
            - name: container
              containerPort: 6201
          volumeMounts: *swift-mounts
          resources: *server-resources
          readinessProbe:
            httpGet: {path: /healthcheck, port: container}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthcheck, port: container}
            periodSeconds: 20
            failureThreshold: 3
          lifecycle: *graceful-stop
          securityContext: *container-security

        - name: object-server
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-object-server", "/etc/swift/object-server.conf", "verbose"]
          ports:
            - name: object
              containerPort: 6202
          volumeMounts: *swift-mounts
          resources: *server-resources
          readinessProbe:
            httpGet: {path: /healthcheck, port: object}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthcheck, port: object}
            periodSeconds: 20
            failureThreshold: 3
          lifecycle: *graceful-stop
          securityContext: *container-security

        # ==================== démons de fond : pas de port, pas de probe ====================
        # S'ils s'arrêtent, le conteneur s'arrête, et le kubelet le relance.
        - name: account-replicator
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-account-replicator", "/etc/swift/account-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: &daemon-resources
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: *container-security

        - name: account-auditor
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-account-auditor", "/etc/swift/account-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: account-reaper
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-account-reaper", "/etc/swift/account-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: container-replicator
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-container-replicator", "/etc/swift/container-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: container-auditor
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-container-auditor", "/etc/swift/container-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: container-updater
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-container-updater", "/etc/swift/container-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: object-replicator
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-object-replicator", "/etc/swift/object-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: object-auditor
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-object-auditor", "/etc/swift/object-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security

        - name: object-updater
          image: swift-base:2.30.0
          imagePullPolicy: IfNotPresent
          command: ["swift-object-updater", "/etc/swift/object-server.conf", "verbose"]
          volumeMounts: *swift-mounts
          resources: *daemon-resources
          securityContext: *container-security
      volumes:
        - name: swift-etc                       # /etc/swift : 3 sources réunies dans un seul dossier
          projected:
            defaultMode: 0440                   # lecture seule pour le propriétaire et le groupe (fsGroup 55555)
            sources:
              - configMap:
                  name: swift-conf
                  items:                        # seulement les confs du storage, pas proxy-server.conf
                    - {key: account-server.conf,   path: account-server.conf}
                    - {key: container-server.conf, path: container-server.conf}
                    - {key: object-server.conf,    path: object-server.conf}
              - secret:
                  name: swift-secrets
                  items:                        # seulement swift.conf, pas le mot de passe Keystone du proxy
                    - {key: swift.conf, path: swift.conf}
              - configMap:
                  name: swift-rings             # account.ring.gz, container.ring.gz, object.ring.gz
        - name: swift-cache
          emptyDir:
            sizeLimit: 64Mi                     # cache recon : quelques fichiers JSON
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # d1 : ajouté automatiquement par le StatefulSet à partir de volumeClaimTemplates
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: d1                                # PVC d1-swift-storage-<i>, liée à un PV de la classe swift-disks
        labels:
          app.kubernetes.io/name: swift
          app.kubernetes.io/component: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: swift-disks
        resources:
          requests:
            storage: ${SWIFT_STORAGE_REQUEST}   # 90 % de NODE_STORAGE_SIZE (taille minimale du disque accepté)
