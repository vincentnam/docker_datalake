apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: storage-1
  name: storage-1
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: storage-1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: storage-1
    spec:
      containers:
        - command:
            - sh
            - /scripts/storage/storage-1.sh
          image: storage-1
          name: storage-1
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /etc/swift
              name: storage-1-claim0
            - mountPath: /internal_dev
              name: storage-1-claim1
            - mountPath: /scripts
              name: storage-1-claim2
            - mountPath: /etc/rsyncd.conf
              name: storage-1-claim3
      hostname: storage-1
      restartPolicy: Always
      volumes:
        - name: storage-1-claim0
          persistentVolumeClaim:
            claimName: storage-1-claim0
        - name: storage-1-claim1
          persistentVolumeClaim:
            claimName: storage-1-claim1
        - name: storage-1-claim2
          persistentVolumeClaim:
            claimName: storage-1-claim2
        - name: storage-1-claim3
          persistentVolumeClaim:
            claimName: storage-1-claim3
