apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: initswift
  name: initswift
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: initswift
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: initswift
    spec:
      containers:
        - args:
            - sh
            - /scripts/init.sh
          image: initswift
          name: initswift
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /etc/swift
              name: initswift-claim0
            - mountPath: /srv
              name: initswift-claim1
            - mountPath: /scripts
              name: initswift-claim2
      restartPolicy: Always
      volumes:
        - name: initswift-claim0
          persistentVolumeClaim:
            claimName: initswift-claim0
        - name: initswift-claim1
          persistentVolumeClaim:
            claimName: initswift-claim1
        - name: initswift-claim2
          persistentVolumeClaim:
            claimName: initswift-claim2
