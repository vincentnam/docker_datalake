# Template rendu par kubernetes/start.sh : ${APP_TAG} = commit git de l'image construite
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: datalake
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: access-zone
    app.kubernetes.io/version: "${APP_TAG}"
spec:
  replicas: 1                               # à augmenter une fois vérifié que l'API ne garde aucun état en mémoire
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: access-zone
        app.kubernetes.io/version: "${APP_TAG}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 55556                    # utilisateur « flask » de l'image (kubernetes/access_zone/flask/Dockerfile)
        runAsGroup: 55556
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-app
          image: datalake-flask:${APP_TAG}
          imagePullPolicy: IfNotPresent
          # la commande (gunicorn, 3 workers) est celle de l'image
          envFrom:                          # toutes les clés deviennent des variables d'environnement
            - configMapRef:
                name: flask-env
            - secretRef:
                name: flask-env
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: tmp                     # fichiers de contrôle des workers gunicorn
              mountPath: /tmp
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /flask-health-check, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /flask-health-check, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 60     # gunicorn finit les requêtes en cours (timeout 60 s)
