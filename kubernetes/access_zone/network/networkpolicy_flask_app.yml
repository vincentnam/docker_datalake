# L'API n'est joignable que par le point d'entrée nginx et par JupyterHub (hub et notebooks, namespace datalake-jupyter).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-app-ingress
  namespace: datalake
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: access-zone
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-proxy
        - namespaceSelector:                # JupyterHub : authentification des utilisateurs (hub), appels des notebooks
            matchLabels:
              kubernetes.io/metadata.name: datalake-jupyter
      ports:
        - {port: 5000}
