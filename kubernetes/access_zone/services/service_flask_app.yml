apiVersion: v1
kind: Service
metadata:
  name: flask-app                           # http://flask-app:5000 (nginx-proxy, JupyterHub)
  namespace: datalake
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: access-zone
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flask-app
  ports:
    - name: http
      port: 5000
      targetPort: http
