# Interne au cluster : seul Traefik (porte d'entrée unique, voir kubernetes_config/traefik_config.yml)
# l'appelle, par l'Ingress access_zone/ingress/ingress_datalake.yml. Le port 7000 de la machine est ouvert par Traefik.
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: datalake
  labels:
    app.kubernetes.io/name: nginx-proxy
    app.kubernetes.io/component: reverse-proxy
    app.kubernetes.io/part-of: access-zone
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-proxy
  ports:
    - name: http
      port: 7000
      targetPort: http
