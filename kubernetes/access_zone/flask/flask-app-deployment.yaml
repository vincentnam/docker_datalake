apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: flask-app
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask-app
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: flask-app
    spec:
      containers:
        - args:
            - python
            - /home/app/app.py
          image: flask-app
          livenessProbe:
            exec:
              command:
                - curl --silent --fail localhost:5000/flask-health-check || exit 1
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 10
          name: flask-app
          volumeMounts:
            - mountPath: /home/app/app.py
              name: flask-app-claim0
      restartPolicy: Always
      volumes:
        - name: flask-app-claim0
          persistentVolumeClaim:
            claimName: flask-app-claim0
