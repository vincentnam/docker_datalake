apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: nginx-proxy
  name: nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nginx-proxy
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: nginx-proxy
    spec:
      containers:
        - image: nginx-proxy
          name: nginx-proxy
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
