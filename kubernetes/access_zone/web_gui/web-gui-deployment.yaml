apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: web-gui
  name: web-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web-gui
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: web-gui
    spec:
      containers:
        - image: web_gui
          name: web-gui
          volumeMounts:
            - mountPath: /opt/app/web_gui
              name: web-gui-claim0
      restartPolicy: Always
      volumes:
        - name: web-gui-claim0
          persistentVolumeClaim:
            claimName: web-gui-claim0
