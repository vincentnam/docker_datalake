apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --profile datalake
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: hub
  name: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: hub
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --profile datalake
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: hub
    spec:
      containers:
        - env:
            - name: DOCKER_NETWORK_NAME
              value: swift-cluster
            - name: DOCKER_NOTEBOOK_DIR
              value: /home/jovyan/work
            - name: DOCKER_NOTEBOOK_IMAGE
              value: cors_base-notebook:latest
            - name: JUPYTERHUB_ADMIN
              value: admin
          image: jupyterhub
          name: jupyterhub
          volumeMounts:
            - mountPath: /srv/jupyterhub/jupyterhub_config.py
              name: hub-claim0
              readOnly: true
            - mountPath: /data
              name: hub-claim2
      restartPolicy: Always
      volumes:
        - name: hub-claim0
          persistentVolumeClaim:
            claimName: hub-claim0
            readOnly: true
        - name: hub-claim2
          persistentVolumeClaim:
            claimName: hub-claim2
