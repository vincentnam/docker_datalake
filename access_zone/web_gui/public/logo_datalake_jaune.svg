  <g stroke="#EAB308" stroke-width="3" fill="#EAB308">
    <line x1="150" y1="130" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="250" y2="130"/>
    <line x1="150" y1="130" x2="150" y2="175"/>
    <line x1="250" y1="130" x2="250" y2="175"/>
    <line x1="150" y1="175" x2="200" y2="150"/>
    <line x1="250" y1="175" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="200" y2="100"/>

    <circle cx="200" cy="100" r="9"/>
    <circle cx="150" cy="130" r="7"/>
    <circle cx="250" cy="130" r="7"/>
    <circle cx="150" cy="175" r="7"/>
    <circle cx="250" cy="175" r="7"/>
    <circle cx="200" cy="150" r="8" fill="#EAB308" stroke="#EAB308"/>
  </g>
