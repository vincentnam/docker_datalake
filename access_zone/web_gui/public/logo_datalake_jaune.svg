<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="200,48 322,119 322,261 200,332 78,261 78,119"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hexClip)">
    <rect x="60" y="180" width="280" height="180" fill="url(#waveGrad)" opacity="0.25"/>
    <path d="M 60 210 Q 110 190 160 210 T 260 210 T 340 210 L 340 360 L 60 360 Z"
